
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Strand2Future</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header class="navbar">
    <a href="/" class="logo">Strand<span>2Future</span></a>
    <nav>
        <a href="/">Home</a>
        <a href="{% url 'register' %}" class="nav-button">Get Started</a>
    </nav>
</header>

<main class="auth-container">
    <div class="auth-card">
        <h1>Welcome Back!</h1>
        <p class="auth-description">
            Log in to continue exploring your future.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="success-message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit" class="primary-button auth-submit">
                Log In
            </button>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="{% url 'register' %}">Create an account</a>
        </p>
    </div>
</main>

</body>
</html>
